<title>TaskMiner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: barra escura de produto + coluna de 1140px; telas como rotas por hash (#entrar, #empresa, #c3, #c3-p1) */
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1b1e1d; --muted: #646b68; --line: #dfe2dd; --chip: #eceee9;
    --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #e0f0ea;
    --violet: #4b4fa8; --violet-soft: #e9eafa; --warn: #8f4a17; --warn-soft: #f9ecdf; --danger: #a8322d; --danger-soft: #fbe7e5;
    --bar: #17201d; --bar-ink: #ffffff; --bar-muted: #9fb0aa; --bar-accent: #7fd1b9; --bar-line: #2c3833;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --marca-neutra: #c6ccc7; --grade: #e8ebe7;
    --q1: #cde2fb; --q2: #9ec5f4; --q3: #5598e7; --q4: #256abf; --q5: #104281; --q-ink: #ffffff;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121615; --card: #1a201e; --ink: #e6ebe8; --muted: #9aa5a1; --line: #2a3330; --chip: #242c29;
    --accent: #7fd1b9; --accent-ink: #0f231d; --accent-soft: #1d3a32;
    --violet: #a9acf0; --violet-soft: #26284a; --warn: #f0b27a; --warn-soft: #3a2a1b; --danger: #f19a94; --danger-soft: #3d1f1d;
    --bar: #0b0e0d; --bar-ink: #ffffff; --bar-muted: #8a9a95; --bar-accent: #7fd1b9; --bar-line: #26302c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --marca-neutra: #3d4844; --grade: #252d2a;
    --q1: #1a3352; --q2: #184f95; --q3: #256abf; --q4: #3987e5; --q5: #86b6ef; --q-ink: #0b0e0d;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #121615; --card: #1a201e; --ink: #e6ebe8; --muted: #9aa5a1; --line: #2a3330; --chip: #242c29;
    --accent: #7fd1b9; --accent-ink: #0f231d; --accent-soft: #1d3a32;
    --violet: #a9acf0; --violet-soft: #26284a; --warn: #f0b27a; --warn-soft: #3a2a1b; --danger: #f19a94; --danger-soft: #3d1f1d;
    --bar: #0b0e0d; --bar-ink: #ffffff; --bar-muted: #8a9a95; --bar-accent: #7fd1b9; --bar-line: #26302c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --marca-neutra: #3d4844; --grade: #252d2a;
    --q1: #1a3352; --q2: #184f95; --q3: #256abf; --q4: #3987e5; --q5: #86b6ef; --q-ink: #0b0e0d;
    color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .gut { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .faixa { background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .faixa .gut { padding-block: 7px; }
  header { background: var(--bar); color: var(--bar-ink); }
  .topo { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; padding-block: 12px; }
  .marca { font-weight: 700; font-size: 17px; color: var(--bar-ink); }
  .marca span { color: var(--bar-accent); }
  .marca:hover { text-decoration: none; }
  .empresa-nome { color: var(--bar-muted); font-size: 13px; padding-left: 14px; border-left: 1px solid var(--bar-line); }
  nav.menu { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.menu a { color: var(--bar-muted); font-size: 14px; padding: 5px 10px; border-radius: 6px; }
  nav.menu a:hover, nav.menu a.ativo { color: var(--bar-ink); background: var(--bar-line); text-decoration: none; }
  .quem { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--bar-muted); }
  .quem button { background: none; border: 1px solid var(--bar-line); color: var(--bar-ink); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  main.gut { padding-block: 26px 60px; }
  h1 { font-size: 26px; letter-spacing: -.015em; margin: 0 0 4px; text-wrap: balance; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 32px 0 12px; font-weight: 600; }
  h3 { margin: 0 0 4px; font-size: 17px; text-wrap: balance; }
  .lead { color: var(--muted); margin: 0; }
  .grade { display: grid; gap: 12px; }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g2 { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0 20px; }
  .g2 > * { min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
  .tag.diaria, .tag.documentado { background: var(--accent-soft); color: var(--accent); }
  .tag.semanal, .tag.coletando { background: var(--violet-soft); color: var(--violet); }
  .tag.recorrente, .tag.pronto { background: var(--warn-soft); color: var(--warn); }
  .tag.neutra, .tag.aguardando { background: var(--chip); color: var(--muted); font-weight: 500; }
  .tag.admin { background: var(--ink); color: var(--bg); }
  ul.limpa { margin: 6px 0 0; padding-left: 18px; }
  ul.limpa li { margin: 3px 0; }
  .mono, .hora { font-family: var(--mono); }
  .mono { font-size: 13px; }
  .titulo-linha { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; }
  form.campos { display: grid; gap: 14px; }
  .linha-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
  label .dica { font-weight: 400; color: var(--muted); }
  input, select { font: inherit; font-size: 15px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
  input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { display: inline-flex; align-items: center; justify-content: center; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn:hover { text-decoration: none; filter: brightness(1.06); }
  .btn.sec { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.perigo { background: transparent; color: var(--danger); border-color: var(--danger); }
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .aviso { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .aviso.ok { background: var(--accent-soft); color: var(--accent); }
  .aviso.erro { background: var(--danger-soft); color: var(--danger); }
  .tabela { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .proc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 18px; color: inherit; }
  .proc:hover { border-color: var(--accent); text-decoration: none; }
  .proc .meta { color: var(--muted); font-size: 13px; }
  .fluxo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  .fluxo .app { background: var(--chip); border-radius: 6px; padding: 2px 8px; color: var(--ink); }
  .fluxo .seta { color: var(--muted); }
  .num-dir { text-align: right; }
  .num-dir .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .num-dir .l { color: var(--muted); font-size: 12px; }
  .rotina .item { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rotina .item:last-child { border-bottom: 0; }
  .barras { display: flex; flex-direction: column; gap: 9px; }
  .barra { display: grid; grid-template-columns: 140px minmax(0, 1fr) 80px; gap: 10px; align-items: center; font-size: 13px; }
  .barra .rot { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trilho { background: var(--chip); border-radius: 4px; height: 12px; overflow: hidden; }
  .trilho .enc { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .barra .val { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .colunas { display: flex; align-items: flex-end; gap: 8px; height: 190px; padding-top: 6px; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .col .enc { width: 100%; max-width: 52px; background: var(--violet); border-radius: 4px 4px 0 0; }
  .col .val, .col .rot { color: var(--muted); }
  ol li { min-width: 0; }
  .card ol { min-width: 0; }
  [hidden] { display: none !important; }
  pre.cmd { white-space: pre-wrap; word-break: break-all; background: var(--bar); color: var(--bar-ink); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font: 13px/1.5 var(--mono); margin: 8px 0 0; max-width: 100%; }
  /* ---------------- gráficos ---------------- */
  .gbarras { display: flex; flex-direction: column; gap: 10px; }
  .gbarra { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 76px; gap: 12px; align-items: center; font-size: 13px; }
  .gbarra .rot { display: grid; min-width: 0; }
  .gbarra .nome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gbarra .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gbarra .trilho { height: 14px; background: none; border-radius: 0; }
  .gbarra .enc { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
  .gbarra .enc.destaque { background: var(--danger); }
  .gbarra .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .comp { display: grid; gap: 8px; }
  .comp-barra { display: flex; gap: 2px; height: 26px; }
  .comp-barra .seg { background: var(--marca-neutra); display: flex; align-items: center; justify-content: center; min-width: 4px; }
  .comp-barra .seg:first-child { border-radius: 4px 0 0 4px; }
  .comp-barra .seg:last-child { border-radius: 0 4px 4px 0; }
  .comp-barra .seg.gargalo { background: var(--danger); }
  .comp-barra .seg-txt { font-size: 12px; font-weight: 700; color: var(--ink); }
  .comp-barra .seg.gargalo .seg-txt { color: var(--card); }
  .comp-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .comp-leg .gargalo { color: var(--danger); font-weight: 600; }
  .legenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .sw.s1, .s1 { background: var(--s1); } .sw.s2, .s2 { background: var(--s2); } .sw.s3, .s3 { background: var(--s3); }
  .sw.bola { border-radius: 50%; } .sw.lento { background: var(--danger); }
  .sw.linha { height: 0; border-top: 2px dashed var(--muted); border-radius: 0; width: 16px; }
  .sw.caixa-leg { background: var(--s1); opacity: .35; } .sw.med-leg { width: 3px; height: 14px; background: var(--ink); border-radius: 0; }
  .gcols { display: flex; align-items: flex-end; gap: 6px; height: 200px; padding-top: 8px; }
  .gcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .gcol .pilha { width: 100%; max-width: 44px; display: flex; flex-direction: column; gap: 2px; }
  .gcol .pilha span { display: block; min-height: 3px; }
  .gcol .pilha span:first-child { border-radius: 4px 4px 0 0; }
  .gcol .val { font-weight: 600; } .gcol .rot { color: var(--muted); }
  .tabela-dados { margin-top: 12px; font-size: 13px; }
  .tabela-dados summary { cursor: pointer; color: var(--muted); }
  .calor-wrap { overflow-x: auto; }
  .calor { display: grid; gap: 3px; min-width: 420px; font-size: 11px; }
  .calor .h { color: var(--muted); text-align: center; } .calor .d { color: var(--muted); align-self: center; }
  .cel { display: flex; align-items: center; justify-content: center; height: 30px; border-radius: 4px; background: var(--chip); color: var(--q-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cel.n1 { background: var(--q1); } .cel.n2 { background: var(--q2); } .cel.n3 { background: var(--q3); } .cel.n4 { background: var(--q4); } .cel.n5 { background: var(--q5); }
  .calor-esc { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .calor-esc .cel { width: 18px; height: 12px; }
  svg.disp { width: 100%; height: auto; display: block; }
  svg.disp .grade { stroke: var(--grade); stroke-width: 1; }
  svg.disp .eixo { fill: var(--muted); font: 11px var(--sans); }
  svg.disp .mediana { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; }
  svg.disp .rot-med { fill: var(--ink); font: 600 12px var(--sans); paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
  svg.disp circle { fill: var(--s1); stroke: var(--card); stroke-width: 2; }
  svg.disp circle.lento { fill: var(--danger); }
  svg.disp circle:hover { r: 7; }
  .faixas { display: flex; flex-direction: column; gap: 12px; }
  .faixa-l { display: grid; grid-template-columns: 150px minmax(0, 1fr) 80px; gap: 12px; align-items: center; font-size: 13px; }
  .faixa-l .rot { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trilho-f { position: relative; height: 18px; }
  .trilho-f .bigode { position: absolute; top: 8px; height: 2px; background: var(--muted); }
  .trilho-f .caixa { position: absolute; top: 2px; height: 14px; background: var(--s1); opacity: .35; border-radius: 3px; }
  .trilho-f .caixa.gargalo { background: var(--danger); opacity: .45; }
  .trilho-f .med { position: absolute; top: 0; width: 3px; height: 18px; background: var(--ink); margin-left: -1px; }
  .faixa-l .val { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------------- gargalos ---------------- */
  .gargalos { display: grid; gap: 10px; }
  .gargalo-item { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 12px 14px; background: var(--card); }
  .gargalo-item.sev-alta { border-left-color: var(--danger); }
  .gargalo-item.sev-media { border-left-color: var(--warn); }
  .gargalo-item p { margin: 6px 0 0; }
  .gargalo-item .sug { color: var(--muted); font-size: 14px; }
  .g-topo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .sev { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .sev-alta .sev { color: var(--danger); } .sev-media .sev { color: var(--warn); }
  .impacto { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; display: grid; }
  .impacto small { font-weight: 400; color: var(--muted); font-size: 11px; }
  .contagem-sev { display: inline-flex; gap: 6px; }
  .pill-alta { background: var(--danger-soft); color: var(--danger); } .pill-media { background: var(--warn-soft); color: var(--warn); }
  @media (max-width: 640px) {
    .gbarra { grid-template-columns: minmax(0, 1fr) 64px; }
    .gbarra .trilho { grid-column: 1 / -1; grid-row: 2; }
    .faixa-l { grid-template-columns: minmax(0, 1fr) 70px; }
    .faixa-l .trilho-f { grid-column: 1 / -1; grid-row: 2; }
    .impacto { margin-left: 0; text-align: left; }
  }

  /* ---------------- documentação (POP) ---------------- */
  .pop { display: grid; gap: 16px; }
  .pop-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 16px; flex-wrap: wrap; }
  .pop-cab > div { min-width: 0; flex: 1 1 320px; }
  .pop-cod { font: 500 12px var(--mono); color: var(--muted); letter-spacing: .04em; }
  .pop-nome { font-size: 20px; margin: 2px 0 4px; }
  .pop-ficha { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pop-ficha > div { background: var(--bg); padding: 9px 12px; min-width: 0; }
  .pop-ficha .largo { grid-column: 1 / -1; }
  .pop-ficha dt { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .pop-ficha dd { margin: 2px 0 0; font-size: 14px; }
  .pop-es { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
  .pop h4 { margin: 0; font-size: 14px; }
  .pop-sec { font-size: 12px !important; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding-top: 4px; border-top: 1px solid var(--line); padding-top: 14px; }
  .pop-passos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .pop-passos > li { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .pop-passos > li.com-gargalo { border-color: var(--danger); box-shadow: inset 3px 0 0 var(--danger); }
  .pp-topo { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
  .pp-num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 13px; flex: none; }
  .pp-tempo { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pop-passos p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .pp-sub { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .pp-sub li { display: grid; grid-template-columns: 38px minmax(0, 1fr); font-size: 14px; }
  .pp-subnum { font: 12px/1.9 var(--mono); color: var(--muted); }
  details.brutos { margin-top: 32px; }
  details.brutos > summary { cursor: pointer; list-style-position: outside; margin-bottom: 12px; }
  .manual-indice { columns: 2; column-gap: 32px; margin: 0; padding-left: 20px; }
  .manual-indice li { margin: 4px 0; break-inside: avoid; }
  .rotina-sem { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .rotina-sem .dia { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  .rotina-sem .dia h4 { margin: 0 0 8px; font-size: 13px; }
  .rotina-sem .it { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
  .rotina-sem .it .hora { font-size: 12px; color: var(--muted); display: block; }
  @media (max-width: 860px) { .rotina-sem { grid-template-columns: minmax(0, 1fr); } .manual-indice { columns: 1; } }
  @media (max-width: 640px) { .pop-ficha { grid-template-columns: minmax(0, 1fr); } .pop-es { grid-template-columns: minmax(0, 1fr); } .pp-tempo { margin-left: 0; } }

  /* ---------------- tela principal: atividades ---------------- */
  .ativ { display: grid; gap: 12px; }
  .ativ-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 16px; flex-wrap: wrap; }
  .ativ-cab > div { min-width: 0; flex: 1 1 320px; }
  .ativ-cab h3 { font-size: 19px; }
  .ativ-cab h3 a { color: var(--ink); }
  .ativ-btn { padding: 7px 12px; font-size: 13px; }

function dispersao(p) {

  const ymax0 = Math.ceil(Math.max(...dur) / 60) || 1, passo = Math.max(1, Math.ceil(ymax0 / 4)), ymax = Math.ceil(ymax0 / passo) * passo;
  const sx = (W - ml - mr) / ((t1 - t0) || 1), sy = (H - mt - mb) / (ymax * 60), ym = H - mb - med * sy;
  let g = "";
  for (let m = 0; m <= ymax; m += passo) { const y = H - mb - m * 60 * sy; g += `<line class="grade" x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}"/><text class="eixo" x="${ml - 6}" y="${y + 4}" text-anchor="end">${m} min</text>`; }
  const pts = ex.map(e => { const lento = e[1] >= med * 2; return `<circle class="${lento ? "lento" : ""}" cx="${(ml + (e[0] - t0) * sx).toFixed(1)}" cy="${(H - mb - e[1] * sy).toFixed(1)}" r="4.5"><title>${dataHora(e[0])} · ${num(e[1] / 60)} min${lento ? " · lenta" : ""}</title></circle>`; }).join("");
  const d0 = new Date(t0 * 1000).toLocaleDateString("pt-BR").slice(0, 5), d1 = new Date(t1 * 1000).toLocaleDateString("pt-BR").slice(0, 5);
  return `<svg class="disp" viewBox="0 0 ${W} ${H}" role="img" aria-label="Duração de cada execução">${g}
    <line class="mediana" x1="${ml}" x2="${W - mr}" y1="${ym}" y2="${ym}"/>${pts}
    <text class="rot-med" x="${ml + 6}" y="${ym - 8}">normal: ${num(med / 60)} min</text>
    <text class="eixo" x="${ml}" y="${H - 6}">${d0}</text><text class="eixo" x="${W - mr}" y="${H - 6}" text-anchor="end">${d1}</text></svg>
    <div class="legenda"><span><i class="sw s1 bola"></i>execução normal</span><span><i class="sw lento bola"></i>2× ou mais o tempo normal</span><span><i class="sw linha"></i>tempo normal (mediana)</span></div>`;
}

function faixas(p) {
  const mx = Math.max(1, ...p.passos.map(s => s.p90_s)), eg = new Set(p.gargalos.map(g => g.etapa)), pc = v => (100 * v / mx).toFixed(1);
  return `<div class="faixas">${p.passos.map((s, i) => `<div class="faixa-l" title="Etapa ${i + 1} · ${esc(s.app)}: normal ${s.mediana_s} s; metade das execuções entre ${s.p25_s} e ${s.p75_s} s; 90% até ${s.p90_s} s">
    <span class="rot"><b>${i + 1}</b> ${esc(s.app)}</span>
    <span class="trilho-f"><span class="bigode" style="left:${pc(s.p25_s)}%;width:${pc(s.p90_s - s.p25_s)}%"></span>
      <span class="caixa ${eg.has(i) ? "gargalo" : ""}" style="left:${pc(s.p25_s)}%;width:${Math.max(.8, 100 * (s.p75_s - s.p25_s) / mx).toFixed(1)}%"></span>
      <span class="med" style="left:${pc(s.mediana_s)}%"></span></span>
    <span class="val">${mmss(s.mediana_s)}</span></div>`).join("")}
    <div class="legenda"><span><i class="sw caixa-leg"></i>metade das execuções</span><span><i class="sw linha"></i>até 90% das execuções</span><span><i class="sw med-leg"></i>tempo normal</span></div></div>`;
}

function listaGargalos(lista, comProcesso) {
  if (!lista.length) return '<p class="lead" style="margin:0">Nenhum gargalo identificado: as etapas têm tempo estável e bem distribuído.</p>';
  return `<div class="gargalos">${lista.map(g => `<div class="gargalo-item sev-${g.severidade}" data-area="${esc(g.area || "")}" data-sev="${g.severidade}">
    <div class="g-topo"><span class="sev">${g.severidade === "alta" ? "▲ Alta" : "● Média"}</span><strong>${esc(g.titulo)}</strong>
      ${comProcesso ? `<span class="lead">· <a href="${g.link}">${esc(g.processo)}</a> · ${esc(g.responsavel)}</span>` : ""}
      ${g.horas_semana ? `<span class="impacto">${br(g.horas_semana)} h<small>${esc(g.metrica)}</small></span>` : ""}</div>
    <p>${esc(g.detalhe)}</p><p class="sug"><b>O que fazer:</b> ${esc(g.sugestao)}</p></div>`).join("")}</div>`;
}

function gargalosDe(contas) {
  const ordem = { alta: 0, media: 1 }, l = [];
  contas.forEach(c => { const r = res(c); if (r) r.processos.forEach(p => p.gargalos.forEach(g => l.push({ ...g, processo: p.documento.nome, responsavel: c.nome, area: c.area || "Sem área definida", link: `#c${c.id}-${p.id}` }))); });
  return l.sort((a, b) => ordem[a.severidade] - ordem[b.severidade] || (b.horas_semana || 0) - (a.horas_semana || 0));
}

function telaGraficosEmpresa() {
  const comDados = estado.contas.filter(res);
  if (!comDados.length) return '<h1>Gráficos da empresa</h1><div class="card"><p class="lead" style="margin:0">Os gráficos aparecem quando houver colaboradores com processos documentados.</p></div>';
  const porArea = {}, gArea = {}, procs = [];
  comDados.forEach(c => { const r = res(c), a = c.area || "Sem área definida";
    porArea[a] = (porArea[a] || 0) + r.estatisticas.tempo_em_processos_s / r.periodo.dias * 5 / 3600;
    r.processos.forEach(p => { procs.push({ rotulo: p.documento.nome, sub: `${c.nome} · ${a}`, valor: p.horas_semana, texto: hTexto(p.horas_semana), destaque: p.gargalos.some(g => g.severidade === "alta"), p, c });
      const ga = gArea[a] ||= { alta: 0, media: 0 }; p.gargalos.forEach(g => ga[g.severidade]++); }); });
  procs.sort((a, b) => b.valor - a.valor);
  const areas = Object.entries(porArea).sort((a, b) => b[1] - a[1]).map(([a, v]) => ({ rotulo: a, valor: v, texto: hTexto(v) }));
  const mxg = Math.max(1, ...Object.values(gArea).map(v => v.alta + v.media));
  const gBar = Object.keys(gArea).sort().map(a => { const v = gArea[a]; return `<div class="gbarra" title="${esc(a)}: ${v.alta} de severidade alta, ${v.media} média"><span class="rot"><span class="nome">${esc(a)}</span></span>
    <span class="trilho" style="display:flex;gap:2px">${v.alta ? `<span class="enc" style="width:${(100 * v.alta / mxg).toFixed(1)}%;background:var(--danger);border-radius:0"></span>` : ""}${v.media ? `<span class="enc" style="width:${(100 * v.media / mxg).toFixed(1)}%;background:var(--warn)"></span>` : ""}</span>
    <span class="val">${v.alta + v.media}</span></div>`; }).join("");
  return `<h1>Gráficos da empresa</h1><p class="lead">Onde está o tempo gasto em tarefas repetitivas e quais áreas concentram os gargalos. Passe o mouse sobre as barras para ver os valores.</p>
    <div class="grade g2"><div><h2>Horas por semana em tarefas repetitivas, por área</h2><div class="card">${barrasH(areas)}</div></div>
      <div><h2>Gargalos por área</h2><div class="card"><div class="legenda"><span><i class="sw" style="background:var(--danger)"></i>alta</span><span><i class="sw" style="background:var(--warn)"></i>média</span></div><div class="gbarras">${gBar}</div>
      <p class="lead" style="margin-top:12px;font-size:13px"><a href="#gargalos">Ver todos os gargalos →</a></p></div></div></div>
    <h2>Processos que mais consomem tempo (horas por semana)</h2><div class="card"><div class="legenda"><span><i class="sw s1"></i>processo</span><span><i class="sw" style="background:var(--danger)"></i>com gargalo de severidade alta</span></div>${barrasH(procs.slice(0, 10))}</div>
    <h2>Onde o tempo vai em cada processo</h2><div class="grade">${procs.map(x => `<div class="card"><div class="titulo-linha" style="margin-bottom:10px"><a href="#c${x.c.id}-${x.p.id}"><strong>${esc(x.p.documento.nome)}</strong></a><span class="lead">${esc(x.c.nome)} · ${x.p.duracao_media} por execução</span></div>${composicao(x.p)}</div>`).join("")}
    <p class="lead" style="font-size:13px">Cada barra é uma execução média dividida por etapa. Em vermelho, as etapas com gargalo.</p></div>`;
}

    <div class="acoes"><label for="f-area" style="font-weight:400;display:flex;align-items:center;gap:8px">Área <select id="f-area" style="width:auto"><option value="">Todas</option>${areas.map(a => `<option>${esc(a)}</option>`).join("")}</select></label>
    <label for="f-sev" style="font-weight:400;display:flex;align-items:center;gap:8px">Severidade <select id="f-sev" style="width:auto"><option value="">Todas</option><option value="alta">Alta</option><option value="media">Média</option></select></label></div></div>

      <div class="card kpi"><div class="v">${new Set(l.map(g => g.processo + g.responsavel)).size}</div><div class="l">processos afetados</div></div>
      <div class="card kpi"><div class="v">${br(inst.toFixed(1))} h</div><div class="l">por semana acima do tempo normal, nas etapas instáveis</div></div></div>
    <h2>Lista de gargalos</h2><div id="lista-g">${listaGargalos(l, true)}</div><p class="lead" id="sem-g" hidden>Nenhum gargalo com esses filtros.</p>
    <h2>Como os gargalos são identificados</h2><div class="card"><ul class="limpa" style="margin:0">
      <li><strong>Etapa concentra o tempo:</strong> uma etapa ocupa 35% ou mais do tempo do processo.</li>
      <li><strong>Tempo instável:</strong> 1 em cada 10 execuções da etapa leva 2 vezes ou mais o tempo normal (mediana).</li>

  return `<article class="pop">
    <div class="pop-cab"><div><span class="pop-cod">${esc(codigo)}</span>
      <h3 class="pop-nome">${link ? `<a href="${link}">${esc(d.nome)}</a>` : esc(d.nome)}</h3><p class="lead">${esc(d.objetivo)}</p></div>
      <span class="tag neutra">escrito por ${esc(d.gerado_por)}</span></div>

      <div><dt>Responsável</dt><dd>${esc(c.nome)} · ${esc(c.funcao || d.responsavel || "—")}</dd></div>

      <div><dt>Duração</dt><dd>${p.duracao_media} por execução</dd></div>
      <div><dt>Sistemas</dt><dd>${esc([...new Set(p.aplicativos)].join(", "))}</dd></div>
      <div class="largo"><dt>Quando fazer</dt><dd>${esc(d.gatilho)}</dd></div>
    </dl>
    ${(d.entradas || []).length || (d.saidas || []).length ? `<div class="pop-es">
      ${(d.entradas || []).length ? `<div><h4>Entradas</h4><ul class="limpa">${d.entradas.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${(d.saidas || []).length ? `<div><h4>Resultado</h4><ul class="limpa">${d.saidas.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}</div>` : ""}
    <h4 class="pop-sec">Passo a passo</h4>
    <ol class="pop-passos">${d.passos.map((s, i) => `<li class="${mesmo && eg.has(i) ? "com-gargalo" : ""}">

      ${s.descricao ? `<p>${esc(s.descricao)}</p>` : ""}
      ${(s.subpassos || []).length ? `<ol class="pp-sub">${s.subpassos.map((x, j) => `<li><span class="pp-subnum">${i + 1}.${j + 1}</span>${esc(x)}</li>`).join("")}</ol>` : ""}</li>`).join("")}</ol>
    ${lista("Pontos de atenção", d.pontos_de_atencao)}${lista("Oportunidades de melhoria", d.oportunidades_de_automacao)}
  </article>`;
}

function rotinaSemanal(r) {
  const nomes = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"], sem = [[], [], [], [], []];
  r.processos.forEach(p => {
    const dias = p.tipo_frequencia === "diaria" ? [0, 1, 2, 3, 4] : [...new Set(p.execucoes.map(e => (new Date(e[0] * 1000).getDay() + 6) % 7))];
    dias.forEach(d => { if (d < 5) sem[d].push(p); });
  });
  return sem.map((ps, d) => [nomes[d], ps.sort((a, b) => a.horario_tipico.localeCompare(b.horario_tipico))]);
}

function ligarMelhorias() {
  const $ = id => document.getElementById(id);
  if (!$("lista-sug")) return;
  const filtrar = () => { let n = 0;
    document.querySelectorAll("#lista-sug .sug").forEach(el => { const a = $("m-area") ? $("m-area").value : "", p = $("m-pri").value, o = $("m-ori").value, st = $("m-st").value;
      const ok = (!a || el.dataset.area === a) && (!p || el.dataset.pri === p) && (!o || el.dataset.ori === o) && (st === "" || (st === "abertas" ? !["concluida", "descartada"].includes(el.dataset.st) : el.dataset.st === st));
      el.hidden = !ok; if (ok) n++; });
    $("sem-sug").hidden = n > 0 || !document.querySelector("#lista-sug .sug"); };
  ["m-area", "m-pri", "m-ori", "m-st"].forEach(id => { if ($(id)) $(id).onchange = filtrar; });
  filtrar();
  document.querySelectorAll(".sel-status").forEach(sel => sel.onchange = () => {
    statusMelhorias[sel.dataset.chave] = sel.value; salvarStatus();
    const card = sel.closest(".sug"); card.dataset.st = sel.value; card.classList.toggle("feita", ["concluida", "descartada"].includes(sel.value)); });
  const mostrar = nome => { ["sugestoes", "gargalos"].forEach(k => { $("aba-" + k).setAttribute("aria-selected", k === nome); $("painel-" + k).hidden = k !== nome; }); };
  $("aba-sugestoes").onclick = () => mostrar("sugestoes");
  $("aba-gargalos").onclick = () => mostrar("gargalos");
}

function novoProcesso(c, k, editavel, mostrarResp) {
  return `<article class="card novo-proc" data-novo="${c.id}-${k.assinatura}">

    <h3>${esc(k.nome_sugerido)} <span class="lead" style="font-weight:400;font-size:14px">(nome sugerido)</span></h3>
    <p class="lead">${mostrarResp ? `<b style="color:var(--ink)">${esc(c.nome)}</b> · ${esc(c.funcao || "")} · ` : ""}${k.ocorrencias} vezes em ${new Set(k.execucoes.map(e => new Date(e[0] * 1000).toDateString())).size} dias (a partir de ${k.primeira_vez_txt}) · cerca de ${k.duracao_media} por vez</p>
    ${fluxo(k.aplicativos)}
    <details class="np-det"><summary>Ver o que foi observado</summary><ol class="np-passos">${k.passos.map(s => `<li><b>${esc(s.app)}</b> · ${esc(s.tela)}${s.acoes.length ? `<span class="lead"> — ${esc(s.acoes.map(a => a.t).join("; "))}</span>` : ""}</li>`).join("")}</ol></details>

    ${editavel ? `<div class="acoes"><button class="btn bt-decidir" data-cid="${c.id}" data-assin="${k.assinatura}" data-dec="fixo" type="button">Sim, tornar processo fixo</button>

      <button class="btn sec bt-depois" type="button">Decidir depois</button></div>
      <p class="lead" style="font-size:13px;margin:0">Processo fixo entra no manual com o passo a passo, nos gráficos e nas sugestões de melhoria. Atividade pontual deixa de aparecer aqui.</p>`
      : '<p class="lead" style="margin:0">O administrador vai decidir se ela entra no seu manual como processo fixo.</p>'}</article>`;

function ligarNovos() {
  document.querySelectorAll(".bt-decidir").forEach(b => b.onclick = () => {
    decisaoProc[b.dataset.cid + "-" + b.dataset.assin] = b.dataset.dec; salvarDecisoes();
    const c = conta(b.dataset.cid), k = estado.resultados[c.id].candidatos.find(x => x.assinatura === b.dataset.assin);
    if (b.dataset.dec === "fixo") { aviso = ["ok", `“${k.processo_fixo.documento.nome}” agora é um processo fixo de ${c.nome}, com o passo a passo no manual.`]; ir(`c${c.id}-${k.processo_fixo.id}`); }
    else { aviso = ["ok", "Marcado como atividade pontual: não vai mais aparecer como processo novo."]; render(); }
  });
  document.querySelectorAll(".bt-depois").forEach(b => b.onclick = () => { b.closest(".novo-proc").hidden = true; });
}

      <p class="lead">As atividades de cada colaborador e o passo a passo de cada uma, organizados por área. ${total} processo(s) documentado(s).</p></div>
      <div class="acoes"><a class="btn sec" href="#colaboradores">Cadastrar colaborador</a></div></div>
    ${(() => { const ns = estado.contas.flatMap(c => pendentes(c).map(k => [c, k])); return ns.length ? `<h2>Processos novos para decidir (${ns.length})</h2><div class="grade">${ns.map(([c, k]) => novoProcesso(c, k, true, true)).join("")}</div>` : ""; })()}
    <div class="filtros">
      <label for="f-area">Área <select id="f-area"><option value="">Todas</option>${Object.keys(areas).filter(a => a !== "Sem área definida").sort().map(a => `<option>${esc(a)}</option>`).join("")}</select></label>
      <label for="f-colab">Colaborador <select id="f-colab"><option value="">Todos</option>${comDados.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select></label>
      <label for="f-busca">Buscar <input id="f-busca" type="search" placeholder="Ex.: nota fiscal, SAP"></label></div>
    ${Object.keys(areas).sort().map(a => `<section class="bloco-area" data-area="${a === "Sem área definida" ? "" : esc(a)}"><h2 class="area-tit">${esc(a)}</h2>
      ${areas[a].map(c => { const r = res(c); return `<div class="bloco-colab" data-colab="${c.id}">
        <div class="colab-tit"><h3><a href="#c${c.id}">${esc(c.nome)}</a> <span class="lead" style="font-weight:400">· ${esc(c.funcao || "Função não informada")}</span></h3>
          ${r ? `<span class="lead" style="font-size:13px">${r.processos.length} atividade(s) · observado de ${data(r.periodo.inicio)} a ${data(r.periodo.fim)}</span>` : ""}</div>
        ${r ? `<div class="grade">${r.processos.map(p => atividade(p, c)).join("")}</div>`
            : `<div class="card"><p class="lead" style="margin:0">Ainda sem atividades documentadas. Situação: <span class="tag aguardando">Aguardando coleta</span></p></div>`}</div>`; }).join("")}
    </section>`).join("")}
    <p class="lead" id="sem-ativ" hidden style="margin-top:18px">Nenhuma atividade encontrada com esses filtros.</p>`;
}

function telaColaborador(c) {
  const proprio = c.id === eu.id, r = res(c);
  let h = `${eu.papel === "admin" && !proprio ? '<p><a href="#processos">← Processos da empresa</a></p>' : ""}${flash()}
    <h1>${proprio ? "Minhas atividades" : "Atividades de " + esc(c.nome)}</h1>
    <p class="lead">${proprio ? esc(c.nome) + " · " : ""}${esc(c.funcao || "Função não informada")} · ${esc(c.area || "Área não informada")}${r ? ` · observado de ${data(r.periodo.inicio)} a ${data(r.periodo.fim)}` : ""}</p>`;
  if (!r) return h + `<div class="card" style="margin-top:18px"><p style="margin:0 0 8px"><span class="tag aguardando">Aguardando coleta</span></p><p style="margin:0">Ainda não há dados de coleta${proprio ? "" : " para " + esc(c.nome.split(" ")[0])}. ${proprio ? 'Veja em <a href="#coleta">Minha coleta</a> como instalar o agente no seu computador.' : "Depois que o agente rodar no computador da pessoa por duas semanas, as atividades aparecem aqui."}</p></div>`;
  const e = r.estatisticas, f = r.descricao_funcao, ng = r.processos.reduce((a, p) => a + p.gargalos.length, 0);
  const pend = pendentes(c);
  return h + (pend.length ? `<h2>${pend.length === 1 ? "Atividade nova identificada" : "Atividades novas identificadas"}</h2><div class="grade">${pend.map(k => novoProcesso(c, k, eu.papel === "admin", false)).join("")}</div>` : "")
    + `<h2>Rotina da semana</h2><div class="rotina-sem">${rotinaSemanal(r).map(([dia, ps]) => `<div class="dia"><h4>${dia}</h4>${ps.length ? ps.map(p => `<div class="it"><span class="hora">${p.horario_tipico}</span><a href="#c${c.id}-${p.id}">${esc(p.documento.nome)}</a>${p.ocorrencias / r.periodo.dias >= 2 ? ` <span class="lead">· ~${Math.round(p.ocorrencias / r.periodo.dias)}× ao dia</span>` : ""}</div>`).join("") : '<p class="lead" style="font-size:13px;margin:0">Sem atividades recorrentes.</p>'}</div>`).join("")}</div>
    <h2>Passo a passo de cada atividade</h2><div class="grade">${r.processos.map(p => atividade(p, c)).join("")}</div>
    <h2>Descrição da função</h2><div class="card">
      <div class="titulo-linha"><strong style="font-size:17px">${esc(f.cargo_provavel)}</strong><span class="tag neutra">escrito por ${esc(f.gerado_por)}</span></div>
      <p style="margin:8px 0 0">${esc(f.resumo)}</p>
      <div class="grade g2" style="margin-top:12px">
        <div><strong>Responsabilidades</strong><ul class="limpa">${(f.responsabilidades || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div>${(f.sistemas_utilizados || []).length ? `<strong>Sistemas utilizados</strong><p style="margin:6px 0 0">${esc(f.sistemas_utilizados.join(", "))}</p>` : ""}
          ${(f.competencias || []).length ? `<strong style="display:block;margin-top:10px">Competências</strong><p style="margin:6px 0 0">${esc(f.competencias.join(", "))}</p>` : ""}</div></div></div>
    <h2>Indicadores</h2><div class="card"><div class="mini-kpis" style="margin:0">
      <span><b>${r.processos.length}</b> atividades recorrentes</span><span><b>${e.media_diaria}</b> de tempo ativo por dia</span>
      <span><b>${br(e.percentual_repetitivo)}%</b> do tempo em tarefas repetitivas</span><span><b>${ng}</b> gargalo(s) identificado(s)</span></div>
      <div class="acoes" style="margin-top:12px"><a class="btn sec" href="#c${c.id}-graficos">Ver gráficos</a><a class="btn sec" href="#c${c.id}-melhorias">Ver melhorias e gargalos</a></div></div>`;
}

function telaProcesso(c, p) {
  const d = p.documento;
  return `${flash()}<p><a href="#c${c.id}">← ${c.id === eu.id ? "Minhas atividades" : "Atividades de " + esc(c.nome)}</a></p>
    <h1>${esc(d.nome)}</h1>
    <p class="lead">Responsável: ${esc(c.nome)} · ${esc(c.funcao || "")} · ${esc(c.area || "")}</p>
    <p class="lead" style="margin-top:6px"><span class="tag ${p.tipo_frequencia}">${esc(p.frequencia)}</span> <span class="tag neutra">documentado por ${esc(d.gerado_por)}</span></p>
    <div class="grade g4" style="margin-top:16px">
      <div class="card kpi"><div class="v">${p.duracao_media}</div><div class="l">duração média</div></div>
      <div class="card kpi"><div class="v">${p.horario_tipico}</div><div class="l">horário típico (${p.janela_horario})</div></div>
      <div class="card kpi"><div class="v">${p.ocorrencias}</div><div class="l">execuções (${br(p.execucoes_semana)} por semana)</div></div>
      <div class="card kpi"><div class="v">${p.tempo_total}</div><div class="l">tempo total no período</div></div>
    </div>
    <h2>Documentação do processo</h2><div class="card">${pop(p, c, `POP ${c.id}.${p.id.slice(1)}`)}</div>
    <h2>Gargalos (${p.gargalos.length})</h2>${listaGargalos(p.gargalos, false)}
    <div class="grade g2"><div><h2>Duração de cada execução</h2><div class="card">${dispersao(p)}</div></div>
      <div><h2>Tempo por etapa</h2><div class="card">${faixas(p)}</div></div></div>
    <details class="brutos"><summary><h2 style="display:inline">O que foi observado (dados brutos da coleta)</h2></summary>
    <p class="lead" style="margin:0 0 12px">Ações registradas pelo agente em cada etapa e em quantas execuções elas aparecem. É a base do passo a passo acima.</p><div class="grade">${p.passos.map((s, i) => `<div class="card">
      <div class="titulo-linha" style="align-items:baseline"><strong>${i + 1}. ${esc(s.app)} · <span class="mono">${esc(s.tela)}</span>${s.site ? ` <span class="tag neutra" title="Site identificado pelo endereço no navegador">${esc(s.site)} · ${esc(s.navegador)}</span>` : ""}</strong><span class="lead">~${s.duracao_media_s} s nesta etapa</span></div>
      ${s.acoes.length ? `<ul class="limpa">${s.acoes.map(a => `<li>${esc(a.t)} <span class="lead">· ${Math.round(a.f * 100)}% das vezes</span></li>`).join("")}</ul>` : '<p class="lead" style="margin-top:6px">Apenas consulta da tela.</p>'}</div>`).join("")}</div></details>
    ${d.oportunidades_de_automacao && d.oportunidades_de_automacao.length ? `<h2>Oportunidades de automação</h2><div class="card"><ul class="limpa" style="margin:0">${d.oportunidades_de_automacao.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}`;
}

function telaColeta() {
  return `<h1>Minha coleta</h1><p class="lead">Como instalar o agente no seu computador e o que ele registra.</p>
    <div class="grade g2">
      <div><h2>Instalar no seu computador (Windows)</h2><div class="card">
        <ol style="margin:0;padding-left:20px;display:grid;gap:12px">
          <li>Instale o Python 3.10 ou mais novo, marcando “Add Python to PATH”.</li>
          <li>Na pasta do TaskMiner, rode:<pre class="cmd">pip install -r requirements.txt</pre></li>
          <li>Inicie a coleta com o seu código pessoal:<pre class="cmd">python main.py coletar --servidor http://192.168.0.10:5000 --token ${esc(eu.token)}…</pre></li>
          <li>Aceite o termo de consentimento. A coleta dura 14 dias e continua de onde parou se o computador for desligado.</li>
        </ol></div></div>
      <div><h2>O que é registrado</h2><div class="card">
        <strong>Registrado</strong><ul class="limpa"><li>Aplicativo, janela e sistema em uso (nos sites, só o domínio, ex.: crm.empresa.com.br)</li><li>Nome dos botões e campos clicados</li><li>Atalhos de teclado, Enter e Tab</li><li>Quantidade de caracteres digitados</li><li>Períodos sem uso do computador</li></ul>
        <strong style="display:block;margin-top:12px">Nunca registrado</strong><ul class="limpa"><li>O texto que você digita e as senhas</li><li>O endereço completo das páginas</li><li>Capturas de tela</li><li>Navegação anônima e gerenciadores de senha</li><li>E-mails, CPFs e telefones em títulos (são mascarados)</li></ul>
        <p style="margin-bottom:0"><strong>Ctrl+Alt+P</strong> pausa e retoma a coleta a qualquer momento.</p></div></div>
    </div>`;
}

function telaErro(t, m) { return `<div class="acesso"><h1>${t}</h1><p class="lead">${m}</p><p style="margin-top:16px"><a class="btn sec" href="#inicio">Voltar ao início</a></p></div>`; }

// ------------------------------------------------------------------ roteador
function render() {
  let rota = (location.hash || "#inicio").slice(1);
  if (!eu && rota !== "entrar") { ir("entrar"); return; }
  if (eu && (rota === "entrar" || rota === "inicio")) { ir(eu.papel === "admin" ? "processos" : "c" + eu.id); return; }
  const app = document.getElementById("app");
  const admin = eu && eu.papel === "admin";
  let html, m;
  if (rota === "entrar") html = telaEntrar();
  else if (rota === "empresa" || rota === "melhorias" || rota === "processos" || rota === "manual" || rota === "graficos" || rota === "gargalos" || rota === "colaboradores" || rota.startsWith("editar")) {
    if (!admin) html = telaErro("Acesso restrito", "Essa página é só para o administrador da empresa.");
    else if (rota === "empresa") html = telaEmpresa();
    else if (rota === "graficos") html = telaGraficosEmpresa();
    else if (rota === "manual" || rota === "processos") html = telaProcessosEmpresa();
    else if (rota === "gargalos") html = telaMelhorias(estado.contas, null, "gargalos");
    else if (rota === "melhorias") html = telaMelhorias(estado.contas, null);
    else if (rota === "colaboradores") html = telaColaboradores();
    else { const c = conta(rota.slice(6)); html = c ? telaEditar(c) : telaErro("Página não encontrada", "Esse colaborador não existe."); }
  }
  else if (rota === "coleta") html = telaColeta();
  else if ((m = rota.match(/^c(\d+)-melhorias$/))) {
    const c = conta(m[1]);
    if (!c) html = telaErro("Página não encontrada", "Esse colaborador não existe.");
    else if (!admin && c.id !== eu.id) html = telaErro("Acesso restrito", "Você só pode ver as suas próprias melhorias.");
    else html = telaMelhorias([c], c);
  }
  else if ((m = rota.match(/^c(\d+)-manual$/))) {
    const c = conta(m[1]);
    if (!c) html = telaErro("Página não encontrada", "Esse colaborador não existe.");
    else if (!admin && c.id !== eu.id) html = telaErro("Acesso restrito", "Você só pode ver o seu próprio manual.");
    else html = telaManual(c);
  }
  else if ((m = rota.match(/^c(\d+)-graficos$/))) {
    const c = conta(m[1]);
    if (!c) html = telaErro("Página não encontrada", "Esse colaborador não existe.");
    else if (!admin && c.id !== eu.id) html = telaErro("Acesso restrito", "Você só pode ver os seus próprios gráficos.");
    else html = telaGraficosColab(c);
  }
  else if ((m = rota.match(/^c(\d+)(?:-(p\d+))?$/))) {
    const c = conta(m[1]);
    if (!c) html = telaErro("Página não encontrada", "Esse colaborador não existe.");
    else if (!admin && c.id !== eu.id) html = telaErro("Acesso restrito", "Você só pode ver os seus próprios processos.");
    else if (m[2]) { const p = res(c) && res(c).processos.find(x => x.id === m[2]); html = p ? telaProcesso(c, p) : telaErro("Página não encontrada", "Esse processo não existe."); }
    else html = telaColaborador(c);
  }
  else html = telaErro("Página não encontrada", "O endereço não existe.");
  topo(rota);
  app.innerHTML = html;
  ligar(rota);
  window.scrollTo(0, 0);
}

function ligar(rota) {
  const $ = id => document.getElementById(id);
  const val = id => ($(id).value || "").trim();
  if ($("f-entrar")) {
    const entrar = (email, senha) => {
      const c = estado.contas.find(x => x.email === email.toLowerCase());
      if (c && c.ativo && senha === (c.senha || SENHA_DEMO)) { eu = c; lembrar(); ir("inicio"); }
      else { aviso = ["erro", "E-mail ou senha incorretos."]; render(); }
    };
    $("f-entrar").onsubmit = ev => { ev.preventDefault(); entrar(val("email"), $("senha").value); };
    document.querySelectorAll(".contas-demo button").forEach(b => b.onclick = () => { $("email").value = b.dataset.email; $("senha").value = SENHA_DEMO; $("senha").focus(); });
  }
  ligarMelhorias();
  ligarNovos();
  if ($("f-colab")) { const fil = () => { const a = $("f-area").value, cc = $("f-colab").value, b = $("f-busca").value.trim().toLowerCase(); let n = 0;
      document.querySelectorAll(".bloco-area").forEach(sec => { let va = 0; sec.querySelectorAll(".bloco-colab").forEach(bc => { const ok = (!a || sec.dataset.area === a) && (!cc || bc.dataset.colab === cc); const cards = bc.querySelectorAll(".ativ"); let vc = 0;
        cards.forEach(card => { const v = ok && (!b || card.dataset.busca.includes(b)); card.hidden = !v; if (v) vc++; }); const m = ok && (cards.length ? vc > 0 : !b); bc.hidden = !m; if (m) va++; n += vc; }); sec.hidden = va === 0; });
      $("sem-ativ").hidden = n > 0 || (!a && !cc && !b); };
    $("f-area").onchange = $("f-colab").onchange = fil; $("f-busca").oninput = fil; }
  if ($("f-sev")) { const fil = () => { let n = 0; document.querySelectorAll("#lista-g .gargalo-item").forEach(el => { const ok = (!$("f-area").value || el.dataset.area === $("f-area").value) && (!$("f-sev").value || el.dataset.sev === $("f-sev").value); el.hidden = !ok; if (ok) n++; }); $("sem-g").hidden = n > 0; }; $("f-area").onchange = $("f-sev").onchange = fil; }
  if ($("filtro")) $("filtro").onchange = function () { document.querySelectorAll("#t-proc tbody tr").forEach(tr => { tr.hidden = !!this.value && tr.dataset.area !== this.value; }); };
  if ($("f-novo")) $("f-novo").onsubmit = ev => {
    ev.preventDefault();
    const email = val("n-email").toLowerCase();
    if ($("n-senha").value.length < 8) aviso = ["erro", "A senha inicial precisa ter pelo menos 8 caracteres."];
    else if (estado.contas.some(c => c.email === email)) aviso = ["erro", "Já existe uma conta com esse e-mail."];
    else {
      const id = Math.max(...estado.contas.map(c => c.id)) + 1;
      estado.contas.push({ id, nome: val("n-nome"), email, funcao: val("n-funcao"), area: val("n-area"), papel: $("n-papel").value, ativo: true, senha: $("n-senha").value, token: Math.random().toString(36).slice(2, 14) });
      salvar(); aviso = ["ok", `${val("n-nome")} cadastrado(a). Saia e entre com ${email} para ver a tela do colaborador.`];
    }
    render();
  };
  if ($("f-empresa")) {
    $("f-empresa").onsubmit = ev => { ev.preventDefault(); estado.empresa.nome = val("emp-nome") || estado.empresa.nome; estado.empresa.cnpj = val("emp-cnpj"); salvar(); aviso = ["ok", "Dados da empresa salvos."]; render(); };
    $("restaurar").onclick = () => { try { localStorage.removeItem("taskminer-demo"); localStorage.removeItem("taskminer-processos-novos"); localStorage.removeItem("taskminer-melhorias"); } catch (e) {} decisaoProc = {}; statusMelhorias = {}; carregar(); eu = conta(eu.id) || estado.contas[0]; lembrar(); aviso = ["ok", "Demonstração restaurada."]; render(); };
  }
  if ($("f-editar")) {
    const c = conta(rota.slice(6));
    $("f-editar").onsubmit = ev => {
      ev.preventDefault();
      const email = val("e-email").toLowerCase();
      if (estado.contas.some(x => x.email === email && x.id !== c.id)) aviso = ["erro", "Já existe outra conta com esse e-mail."];
      else { Object.assign(c, { nome: val("e-nome"), email, funcao: val("e-funcao"), area: val("e-area") }); if (c.id !== eu.id) c.papel = $("e-papel").value; salvar(); aviso = ["ok", "Alterações salvas."]; }
      render();
    };
    if ($("alternar")) $("alternar").onclick = () => { c.ativo = !c.ativo; salvar(); aviso = ["ok", c.ativo ? "Conta reativada." : "Conta desativada: a pessoa não entra mais."]; render(); };
  }
}

carregar();
window.addEventListener("hashchange", render);
render();
</script>
